apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-blackbox-exporter
  namespace: monitoring
spec:
  dependsOn:
    - name: kube-prometheus-stack
  interval: 30m
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: '11.19.1'
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  values:
    fullnameOverride: prometheus-blackbox-exporter
    service:
      type: ClusterIP
    ingress:
      enabled: false
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    config:
      modules:
        https_application:
          prober: http
          timeout: 10s
          http:
            method: GET
            valid_status_codes: [200]
            follow_redirects: true
            fail_if_not_ssl: true
            preferred_ip_protocol: ip4
            tls_config:
              insecure_skip_verify: false
        http_lan_application:
          prober: http
          timeout: 10s
          http:
            method: GET
            valid_status_codes: [200]
            follow_redirects: true
            preferred_ip_protocol: ip4
    serviceMonitor:
      selfMonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack
        interval: 30s
        scrapeTimeout: 15s
