apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-grafana
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared-grafana
  template:
    metadata:
      labels:
        app: cloudflared-grafana
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 1
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: credentials
              mountPath: /etc/cloudflared/credentials
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: grafana-cloudflared
            items:
              - key: config.yaml
                path: config.yaml
        - name: credentials
          secret:
            secretName: grafana-cloudflare-secret
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-cloudflared
data:
  config.yaml: |
    tunnel: grafana-proxmox
    credentials-file: /etc/cloudflared/credentials/cloudflare-secret.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: grafana-proxmox.vitalyguzun-homelab.com
        service: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local:80
      - service: http_status:404
