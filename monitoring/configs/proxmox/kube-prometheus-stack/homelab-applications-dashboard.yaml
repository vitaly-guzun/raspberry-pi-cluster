apiVersion: v1
kind: ConfigMap
metadata:
  name: homelab-applications-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  homelab-applications.json: |-
    {
      "uid": "homelab-applications",
      "title": "Homelab Applications",
      "id": null,
      "version": 3,
      "schemaVersion": 39,
      "editable": true,
      "tags": [
        "homelab",
        "applications"
      ],
      "timezone": "browser",
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 100,
          "title": "Applications \u00b7 Availability",
          "type": "table",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 10
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "HTTPS checks run from Kubernetes through the configured DNS/Tailscale route with certificate validation. Prowlarr is LAN HTTP. Available means a successful HTTP endpoint check, not a full sign-in/playback test. No data means exporter telemetry is missing. Last success is retained from the first successful check after this phase is deployed.",
          "fieldConfig": {
            "defaults": {
              "noValue": "N/A"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Availability"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "Unavailable",
                            "color": "red"
                          },
                          "1": {
                            "text": "Available",
                            "color": "green"
                          },
                          "2": {
                            "text": "No data",
                            "color": "gray"
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "custom.width",
                    "value": 120
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "URL"
                },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Open application",
                        "url": "${__value.raw}",
                        "targetBlank": true
                      }
                    ]
                  },
                  {
                    "id": "custom.width",
                    "value": 340
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Response time"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 3
                  },
                  {
                    "id": "custom.width",
                    "value": 140
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Last success"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dateTimeAsIso"
                  },
                  {
                    "id": "custom.width",
                    "value": 230
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Application"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 150
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Host"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 100
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Route"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 100
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(max by (app,host,runtime,url,route) (probe_success{job=\"homelab-applications\"}) and on (app,host,runtime,url,route) (max by (app,host,runtime,url,route) (up{job=\"homelab-applications\"}) == 1)) or (2 + 0 * (max by (app,host,runtime,url,route) (up{job=\"homelab-applications\"}) == 0)) or label_replace(label_replace(label_replace(label_replace(label_replace(vector(2), \"app\", \"audiobookshelf\", \"\", \"\"), \"host\", \"mini-pc\", \"\", \"\"), \"runtime\", \"k3s\", \"\", \"\"), \"url\", \"https://audiobooks.vitalyguzun.com\", \"\", \"\"), \"route\", \"HTTPS\", \"\", \"\") or label_replace(label_replace(label_replace(label_replace(label_replace(vector(2), \"app\", \"navidrome\", \"\", \"\"), \"host\", \"mini-pc\", \"\", \"\"), \"runtime\", \"k3s\", \"\", \"\"), \"url\", \"https://navidrome.vitalyguzun.com\", \"\", \"\"), \"route\", \"HTTPS\", \"\", \"\") or label_replace(label_replace(label_replace(label_replace(label_replace(vector(2), \"app\", \"linkding\", \"\", \"\"), \"host\", \"mini-pc\", \"\", \"\"), \"runtime\", \"k3s\", \"\", \"\"), \"url\", \"https://linkding.vitalyguzun.com\", \"\", \"\"), \"route\", \"HTTPS\", \"\", \"\") or label_replace(label_replace(label_replace(label_replace(label_replace(vector(2), \"app\", \"jellyfin\", \"\", \"\"), \"host\", \"mini-pc\", \"\", \"\"), \"runtime\", \"lxc\", \"\", \"\"), \"url\", \"https://jellyfin.vitalyguzun.com\", \"\", \"\"), \"route\", \"HTTPS\", \"\", \"\") or label_replace(label_replace(label_replace(label_replace(label_replace(vector(2), \"app\", \"radarr\", \"\", \"\"), \"host\", \"synology\", \"\", \"\"), \"runtime\", \"docker\", \"\", \"\"), \"url\", \"https://radarr.vitalyguzun.com\", \"\", \"\"), \"route\", \"HTTPS\", \"\", \"\") or label_replace(label_replace(label_replace(label_replace(label_replace(vector(2), \"app\", \"sonarr\", \"\", \"\"), \"host\", \"synology\", \"\", \"\"), \"runtime\", \"docker\", \"\", \"\"), \"url\", \"https://sonarr.vitalyguzun.com\", \"\", \"\"), \"route\", \"HTTPS\", \"\", \"\") or label_replace(label_replace(label_replace(label_replace(label_replace(vector(2), \"app\", \"seerr\", \"\", \"\"), \"host\", \"synology\", \"\", \"\"), \"runtime\", \"docker\", \"\", \"\"), \"url\", \"https://seerr.vitalyguzun.com\", \"\", \"\"), \"route\", \"HTTPS\", \"\", \"\") or label_replace(label_replace(label_replace(label_replace(label_replace(vector(2), \"app\", \"qbittorrent\", \"\", \"\"), \"host\", \"synology\", \"\", \"\"), \"runtime\", \"docker\", \"\", \"\"), \"url\", \"https://torrent.vitalyguzun.com\", \"\", \"\"), \"route\", \"HTTPS\", \"\", \"\") or label_replace(label_replace(label_replace(label_replace(label_replace(vector(2), \"app\", \"prowlarr\", \"\", \"\"), \"host\", \"synology\", \"\", \"\"), \"runtime\", \"docker\", \"\", \"\"), \"url\", \"http://192.168.1.59:9696\", \"\", \"\"), \"route\", \"LAN HTTP\", \"\", \"\")",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "B",
              "expr": "max by (app,host,runtime,url,route) (probe_duration_seconds{job=\"homelab-applications\"}) and on (app,host,runtime,url,route) (max by (app,host,runtime,url,route) (up{job=\"homelab-applications\"}) == 1)",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "C",
              "expr": "max by (app,host,runtime,url,route) (homelab_application_last_success_timestamp_seconds) * 1000",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "runtime": true
                },
                "renameByName": {
                  "app": "Application",
                  "host": "Host",
                  "route": "Route",
                  "url": "URL",
                  "Value #A": "Availability",
                  "Value #B": "Response time",
                  "Value #C": "Last success"
                },
                "indexByName": {
                  "app": 0,
                  "host": 1,
                  "route": 2,
                  "Value #A": 3,
                  "url": 4,
                  "Value #B": 5,
                  "Value #C": 6
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "Application"
                  }
                ]
              }
            }
          ]
        },
        {
          "id": 1,
          "title": "k3s VM \u00b7 CPU",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 10,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "",
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "noValue": "N/A",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{job=\"node-exporter\",mode=\"idle\"}[5m])))",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "time_series",
              "legendFormat": "{{app}}"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 2,
          "title": "k3s VM \u00b7 RAM",
          "type": "stat",
          "gridPos": {
            "x": 4,
            "y": 10,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "",
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "noValue": "N/A",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "100 * (1 - node_memory_MemAvailable_bytes{job=\"node-exporter\"} / node_memory_MemTotal_bytes{job=\"node-exporter\"})",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "time_series",
              "legendFormat": "{{app}}"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 3,
          "title": "Synology \u00b7 System",
          "type": "stat",
          "gridPos": {
            "x": 8,
            "y": 10,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "",
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "noValue": "N/A",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "max(synology_system_temperature_celsius)",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "time_series",
              "legendFormat": "{{app}}"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 4,
          "title": "Synology \u00b7 Hottest disk",
          "type": "stat",
          "gridPos": {
            "x": 12,
            "y": 10,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "",
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "noValue": "N/A",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "max(synology_disk_temperature_celsius)",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "time_series",
              "legendFormat": "{{app}}"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 5,
          "title": "Synology \u00b7 Fans / thermal",
          "type": "stat",
          "gridPos": {
            "x": 16,
            "y": 10,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "N/A",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "Normal",
                      "color": "green"
                    },
                    "2": {
                      "text": "Check DSM",
                      "color": "orange"
                    },
                    "3": {
                      "text": "Check DSM",
                      "color": "orange"
                    },
                    "4": {
                      "text": "Check DSM",
                      "color": "orange"
                    },
                    "5": {
                      "text": "Check DSM",
                      "color": "orange"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "max({__name__=~\"synology_(thermal|system_fan|cpu_fan)_status\"})",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "time_series",
              "legendFormat": "{{app}}"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 6,
          "title": "Synology \u00b7 Disks",
          "type": "stat",
          "gridPos": {
            "x": 20,
            "y": 10,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "N/A",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "Normal",
                      "color": "green"
                    },
                    "2": {
                      "text": "Check DSM",
                      "color": "orange"
                    },
                    "3": {
                      "text": "Check DSM",
                      "color": "orange"
                    },
                    "4": {
                      "text": "Check DSM",
                      "color": "orange"
                    },
                    "5": {
                      "text": "Check DSM",
                      "color": "orange"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "max(synology_disk_status)",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "time_series",
              "legendFormat": "{{app}}"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 7,
          "title": "Applications \u00b7 CPU share of k3s VM",
          "type": "bargauge",
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 12,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Share of the single k3s VM capacity, not physical Proxmox capacity. Main application containers only. Fixed 0\u2013100% scale; small bars are expected at idle.",
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "noValue": "N/A",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "min": 0,
              "max": 100,
              "decimals": 3
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sort_desc(100 * (label_replace(label_replace(label_replace((sum by (namespace) (max by (namespace,pod,container) (rate(container_cpu_usage_seconds_total{namespace=~\"audiobookshelf|navidrome|linkding\",container=~\"audiobookshelf|navidrome|linkding\"}[5m])))), \"app\", \"$1\", \"namespace\", \"(.+)\"), \"host\", \"mini-pc\", \"\", \"\"), \"runtime\", \"k3s\", \"\", \"\")) / scalar(sum(kube_node_status_capacity{resource=\"cpu\",unit=\"core\"})))",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "time_series",
              "legendFormat": "{{app}}"
            }
          ],
          "options": {
            "orientation": "horizontal",
            "displayMode": "basic",
            "showUnfilled": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "text": {
              "valueSize": 20,
              "titleSize": 16
            },
            "namePlacement": "top"
          }
        },
        {
          "id": 8,
          "title": "Applications \u00b7 RAM share of k3s VM",
          "type": "bargauge",
          "gridPos": {
            "x": 12,
            "y": 13,
            "w": 12,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Share of the single k3s VM capacity, not physical Proxmox capacity. Main application containers only. Fixed 0\u2013100% scale; small bars are expected at idle.",
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "noValue": "N/A",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "min": 0,
              "max": 100,
              "decimals": 3
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sort_desc(100 * (label_replace(label_replace(label_replace((sum by (namespace) (max by (namespace,pod,container) (container_memory_working_set_bytes{namespace=~\"audiobookshelf|navidrome|linkding\",container=~\"audiobookshelf|navidrome|linkding\"}))), \"app\", \"$1\", \"namespace\", \"(.+)\"), \"host\", \"mini-pc\", \"\", \"\"), \"runtime\", \"k3s\", \"\", \"\")) / scalar(sum(kube_node_status_capacity{resource=\"memory\",unit=\"byte\"})))",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "time_series",
              "legendFormat": "{{app}}"
            }
          ],
          "options": {
            "orientation": "horizontal",
            "displayMode": "basic",
            "showUnfilled": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "text": {
              "valueSize": 20,
              "titleSize": 16
            },
            "namePlacement": "top"
          }
        },
        {
          "id": 9,
          "title": "Applications \u00b7 k3s",
          "type": "table",
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 24,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Ready = Deployment available/desired replicas, not an HTTP probe. CPU uses 5m / 1h averages as % of VM CPU capacity. Storage is config PVC usage; media excluded. Navidrome storage N/A: kubelet reports shared filesystem usage above PVC size. RAM % VM is the application working set divided by the single k3s VM memory capacity.",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "N/A",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "CPU now"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percent"
                  },
                  {
                    "id": "decimals",
                    "value": 3
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "CPU 1h"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percent"
                  },
                  {
                    "id": "decimals",
                    "value": 3
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "RAM"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "App/config"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Restarts 24h"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "short"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "State"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "short"
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "range",
                        "options": {
                          "from": 0,
                          "to": 0.999999,
                          "result": {
                            "text": "Not ready",
                            "color": "orange"
                          }
                        }
                      },
                      {
                        "type": "range",
                        "options": {
                          "from": 1,
                          "to": 100,
                          "result": {
                            "text": "Ready",
                            "color": "green"
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "RAM % VM"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percent"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  }
                ]
              }
            ]
          },
